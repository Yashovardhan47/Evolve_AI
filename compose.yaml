services:
  evolve:
    build: .
    ports:
      - "8000:8000"
    environment:
      EVOLVE_DB: /app/data/evolve.db
      EVOLVE_SECURE_COOKIES: ${EVOLVE_SECURE_COOKIES:-false}
      EVOLVE_ORIGINS: ${EVOLVE_ORIGINS:-}
      EVOLVE_JWT_SECRET: ${EVOLVE_JWT_SECRET:-}
      EVOLVE_GOOGLE_CLIENT_ID: ${EVOLVE_GOOGLE_CLIENT_ID:-}
      EVOLVE_GOOGLE_CLIENT_SECRET: ${EVOLVE_GOOGLE_CLIENT_SECRET:-}
      EVOLVE_GOOGLE_REDIRECT_URI: ${EVOLVE_GOOGLE_REDIRECT_URI:-}
    volumes:
      - evolve-data:/app/data
    restart: unless-stopped
volumes:
  evolve-data:
