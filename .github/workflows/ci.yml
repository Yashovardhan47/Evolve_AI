name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: ruff check --select E9,F backend
      - run: ruff format --check backend
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --check frontend/app.js && node --check frontend/icons.js && node --check frontend/ui.js
